name: refresh-feed
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node gen.js
        env:
          CONCIERGE_KEY: ${{ secrets.CONCIERGE_KEY }}
      - run: |
          git config user.name "NahaLabs Radar"
          git config user.email "ai-solutions@nahalabs.co.za"
          git add docs
          git diff --cached --quiet || git commit -m "refresh feed"
          git push
